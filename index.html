<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>상반기 평가 피드백 일정 신청</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-100 p-3 sm:p-6">
    <div class="max-w-4xl mx-auto bg-white rounded-xl shadow-md p-4 sm:p-6">
        <!-- 헤더 및 배포 버전 뱃지 영역 -->
        <div class="flex flex-col sm:flex-row sm:items-center justify-between gap-2 mb-1">
            <h2 class="text-xl sm:text-2xl font-bold text-gray-800">상반기 평가 피드백 일정 신청</h2>
            <div id="deployBadge" class="inline-flex items-center text-xs font-mono bg-emerald-50 text-emerald-700 border border-emerald-200 px-2.5 py-1 rounded-md font-semibold self-start sm:self-auto">
                🚀 GitHub Pages 연동 뷰 (API 모드)
            </div>
        </div>
        <p class="text-xs sm:text-sm text-gray-500 mb-6">운영 기간: 2026년 8월 10일 ~ 8월 22일 (일자별 최대 3명, 휴일/마감 제외)</p>

        <!-- 팀원 이름 선택 -->
        <div class="mb-6 bg-blue-50 p-4 rounded-lg border border-blue-100 relative z-20">
            <label class="block text-sm font-bold text-gray-700 mb-1">1. 신청자 이름 선택</label>
            <select id="memberName" onchange="handleNameSelect()" class="w-full sm:w-64 border p-2 rounded text-sm outline-none focus:ring-2 focus:ring-blue-500 bg-white cursor-pointer relative z-30">
                <option value="">이름을 불러오는 중...</option>
            </select>
            <p id="memberStatusMsg" class="text-xs text-gray-500 mt-1.5">* 이름을 선택한 후 달력에서 원하는 날짜 카드를 클릭해 주세요.</p>
        </div>

        <!-- 달력 현황 뷰 안내 -->
        <div class="mb-3 flex justify-between items-center relative z-10">
            <h3 class="font-bold text-gray-700 text-sm sm:text-base">📅 2. 8월 피드백 달력 날짜 선택</h3>
            <span class="text-xs text-gray-500">* 날짜 클릭: 신청 | 이름 태그 클릭: 취소</span>
        </div>

        <div id="loading" class="text-center py-8 text-gray-500 font-semibold">
            달력 데이터를 불러오는 중입니다...
        </div>

        <!-- 7열(일~토) 캘린더 그리드 -->
        <div id="calendarWrapper" class="hidden relative z-10">
            <div class="grid grid-cols-7 gap-1 sm:gap-2 text-center font-bold text-xs sm:text-sm mb-2 border-b pb-2">
                <div class="text-red-500 bg-red-50 py-1 rounded">일</div>
                <div class="text-gray-700 bg-gray-50 py-1 rounded">월</div>
                <div class="text-gray-700 bg-gray-50 py-1 rounded">화</div>
                <div class="text-gray-700 bg-gray-50 py-1 rounded">수</div>
                <div class="text-gray-700 bg-gray-50 py-1 rounded">목</div>
                <div class="text-gray-700 bg-gray-50 py-1 rounded">금</div>
                <div class="text-blue-500 bg-blue-50 py-1 rounded">토</div>
            </div>

            <div id="calendarGrid" class="grid grid-cols-7 gap-1 sm:gap-2 mb-6"></div>
        </div>

        <!-- 신규 신청 영역 -->
        <div id="selectionArea" class="hidden border-t pt-4 flex flex-col sm:flex-row items-center justify-between gap-3 bg-blue-50/50 p-4 rounded-lg">
            <div>
                <span class="text-sm text-gray-600">선택한 일자: </span>
                <span id="selectedDateText" class="font-bold text-blue-600 text-base sm:text-lg"></span>
            </div>
            <button id="submitBtn" onclick="submitApp()" class="w-full sm:w-auto bg-blue-600 text-white px-6 py-2.5 rounded-lg font-bold hover:bg-blue-700 transition shadow">
                이 날짜로 피드백 신청하기
            </button>
        </div>
    </div>

    <script>
        // 연동된 구글 앱스 스크립트(GAS) Web App URL
        const GAS_WEB_APP_URL = "https://script.google.com/macros/s/AKfycbxpw4hmk09lfpul-KzDExsAuvJJVGa2zG_z0SiP75Kdj39WJ-pX5GDU_w3OSz3O3LpFpA/exec";

        let selectedDate = null;

        window.onload = function() {
            loadCalendar();
        };

        function handleScriptError(err) {
            document.getElementById('loading').classList.add('hidden');
            const submitBtn = document.getElementById('submitBtn');
            if (submitBtn) {
                submitBtn.disabled = false;
                submitBtn.innerText = '이 날짜로 피드백 신청하기';
            }
            alert("처리 중 오류가 발생했습니다: " + (err.message || err));
        }

        function loadCalendar() {
            document.getElementById('loading').classList.remove('hidden');
            document.getElementById('calendarWrapper').classList.add('hidden');
            document.getElementById('calendarGrid').innerHTML = '';

            fetch(`${GAS_WEB_APP_URL}?action=getCalendarData`)
                .then(response => response.json())
                .then(data => renderCalendar(data))
                .catch(err => handleScriptError(err));
        }

        function normalizeDateStr(str) {
            if (!str) return "";
            const matches = String(str).match(/\d+/g);
            if (!matches || matches.length === 0) return String(str).trim();
            
            let y = "2026", m = "08", d = "10";
            if (matches.length >= 3) {
                y = matches[0].length === 4 ? matches[0] : matches[2];
                m = (matches[0].length === 4 ? matches[1] : matches[0]).padStart(2, '0');
                d = (matches[0].length === 4 ? matches[2] : matches[1]).padStart(2, '0');
            } else if (matches.length === 2) {
                m = matches[0].padStart(2, '0');
                d = matches[1].padStart(2, '0');
            } else if (matches.length === 1) {
                d = matches[0].padStart(2, '0');
            }
            return `${y}-${m}-${d}`;
        }

        function renderCalendar(data) {
            document.getElementById('loading').classList.add('hidden');
            document.getElementById('calendarWrapper').classList.remove('hidden');
            
            if (data && data.deployVersion) {
                document.getElementById('deployBadge').innerText = `🚀 ${data.deployVersion}`;
            }

            const nameSelect = document.getElementById('memberName');
            const statusMsg = document.getElementById('memberStatusMsg');
            const currentSelected = nameSelect.value;
            nameSelect.innerHTML = '<option value="">-- 이름을 선택하세요 --</option>';
            
            if (data && data.members && data.members.length > 0) {
                data.members.forEach(name => {
                    const opt = document.createElement('option');
                    opt.value = name;
                    opt.innerText = name;
                    if (name === currentSelected) opt.selected = true;
                    nameSelect.appendChild(opt);
                });
                
                statusMsg.className = "text-xs text-gray-500 mt-1.5";
                statusMsg.innerText = `* 미신청자 ${data.members.length}명 / 전체 명단 ${data.totalMembersCount || data.members.length}명`;
            } else {
                if (data && data.memberError) {
                    nameSelect.innerHTML = `<option value="">[오류] ${data.memberError}</option>`;
                    statusMsg.className = "text-xs text-red-500 font-bold mt-1.5";
                    statusMsg.innerText = `⚠️ ${data.memberError}`;
                } else {
                    nameSelect.innerHTML = '<option value="">모든 팀원이 신청을 완료했거나 명단이 없습니다</option>';
                    statusMsg.className = "text-xs text-amber-600 font-semibold mt-1.5";
                    statusMsg.innerText = `* 등록된 팀원이 모두 신청을 마쳤거나 명단 데이터가 존재하지 않습니다.`;
                }
            }

            const grid = document.getElementById('calendarGrid');
            grid.innerHTML = '';

            const emptyStartCard = document.createElement('div');
            emptyStartCard.className = 'bg-gray-50/50 border border-dashed border-gray-200 rounded-lg p-1 sm:p-2 text-center text-[10px] sm:text-xs text-gray-300 flex items-center justify-center min-h-[90px]';
            emptyStartCard.innerText = '8/9(일)';
            grid.appendChild(emptyStartCard);

            if (data && data.limits) {
                data.limits.forEach(item => {
                    const targetDateStr = normalizeDateStr(item.date);
                    const applicants = (data.apps || []).filter(a => normalizeDateStr(a.date) === targetDateStr);
                    const isDisabled = !item.isAvailable;

                    const dayOfWeek = item.dayOfWeek || '월';

                    let dayColorClass = 'text-gray-600';
                    if (dayOfWeek === '토') dayColorClass = 'text-blue-500';
                    if (dayOfWeek === '일' || item.isHoliday) dayColorClass = 'text-red-500';

                    const card = document.createElement('div');
                    card.className = `border rounded-lg p-1.5 sm:p-2 text-center cursor-pointer transition relative flex flex-col justify-between min-h-[95px] sm:min-h-[110px] ${
                        isDisabled ? 'bg-gray-100 border-gray-300 opacity-70 cursor-not-allowed' : 'bg-white hover:border-blue-500 hover:shadow-md'
                    }`;

                    card.onclick = (e) => {
                        if (e.target.tagName === 'BUTTON' || e.target.closest('button')) return;
                        if (isDisabled) return;
                        selectDate(targetDateStr, dayOfWeek, card);
                    };

                    const namesHtml = applicants.length > 0 
                        ? applicants.map(app => `
                            <button onclick="confirmDelete('${app.appId}', '${app.name}', '${targetDateStr}')" title="클릭 시 신청 취소(삭제)" class="inline-flex items-center bg-blue-50 hover:bg-red-50 text-blue-700 hover:text-red-700 border border-blue-200 hover:border-red-300 text-[10px] sm:text-xs px-1 sm:px-1.5 py-0.5 rounded font-medium transition max-w-full truncate">
                                👤 ${app.name} ✕
                            </button>
                        `).join(' ')
                        : '<span class="text-[10px] sm:text-xs text-gray-300">신청자 없음</span>';

                    let statusBadgeHtml = '';
                    let bottomTextHtml = '';

                    if (item.isHoliday) {
                        statusBadgeHtml = `<span class="text-[10px] sm:text-xs px-1.5 sm:px-2 py-0.5 rounded-full bg-red-100 text-red-600 font-bold">휴일</span>`;
                        bottomTextHtml = `<span class="text-[10px] sm:text-xs text-red-400">신청 불가</span>`;
                    } else if (item.isClosed) {
                        statusBadgeHtml = `<span class="text-[10px] sm:text-xs px-1.5 sm:px-2 py-0.5 rounded-full bg-gray-200 text-gray-600 font-bold">마감</span>`;
                        bottomTextHtml = `<span class="text-[10px] sm:text-xs text-gray-400">신청 마감</span>`;
                    } else if (!item.isAvailable) {
                        statusBadgeHtml = `<span class="text-[10px] sm:text-xs px-1.5 sm:px-2 py-0.5 rounded-full bg-gray-200 text-gray-600 font-bold">${item.currentCount}/${item.maxLimit} 마감</span>`;
                        bottomTextHtml = namesHtml;
                    } else {
                        statusBadgeHtml = `<span class="text-[10px] sm:text-xs px-1.5 sm:px-2 py-0.5 rounded-full bg-green-100 text-green-700 font-bold">${item.currentCount}/${item.maxLimit} 가능</span>`;
                        bottomTextHtml = namesHtml;
                    }

                    card.innerHTML = `
                        <div>
                            <div class="text-[10px] sm:text-xs font-bold mb-0.5 ${dayColorClass}">
                                ${targetDateStr.split('-')[2]}일
                            </div>
                            <div class="mb-1">
                                ${statusBadgeHtml}
                            </div>
                        </div>
                        <div class="mt-1 pt-1 border-t border-gray-100 min-h-[30px] flex flex-col justify-center items-center gap-0.5">
                            ${bottomTextHtml}
                        </div>
                    `;

                    grid.appendChild(card);
                });
            }
        }

        function handleNameSelect() {
            const nameSelect = document.getElementById('memberName');
            if (nameSelect.value && selectedDate) {
                document.getElementById('selectionArea').classList.remove('hidden');
            }
        }

        function selectDate(date, dayOfWeek, cardEl) {
            selectedDate = date;
            document.querySelectorAll('#calendarGrid div.border').forEach(el => {
                el.classList.remove('border-blue-600', 'ring-2', 'ring-blue-400');
            });
            cardEl.classList.add('border-blue-600', 'ring-2', 'ring-blue-400');

            document.getElementById('selectedDateText').innerText = `${date} (${dayOfWeek})`;
            const selectionArea = document.getElementById('selectionArea');
            selectionArea.classList.remove('hidden');
            selectionArea.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
        }

        function submitApp() {
            const nameSelect = document.getElementById('memberName');
            const name = nameSelect.value.trim();
            const submitBtn = document.getElementById('submitBtn');

            if (!name) { alert('먼저 신청자 이름을 선택해 주세요.'); return; }
            if (!selectedDate) { alert('달력에서 피드백 일자를 선택해 주세요.'); return; }

            submitBtn.disabled = true;
            submitBtn.innerText = '신청 처리 중...';

            const payload = {
                action: 'applyByDate',
                memberName: name,
                selectedDate: selectedDate
            };

            fetch(GAS_WEB_APP_URL, {
                method: 'POST',
                body: JSON.stringify(payload)
            })
            .then(res => res.json())
            .then(res => {
                alert(res.message);
                submitBtn.disabled = false;
                submitBtn.innerText = '이 날짜로 피드백 신청하기';

                if (res.success) {
                    nameSelect.value = '';
                    document.getElementById('selectionArea').classList.add('hidden');
                    selectedDate = null;
                    loadCalendar();
                }
            })
            .catch(err => handleScriptError(err));
        }

        function confirmDelete(appId, name, currentDate) {
            if (confirm("'" + name + "' 님의 " + currentDate + " 피드백 신청을 정말 취소(삭제)하시겠습니까?")) {
                document.getElementById('loading').classList.remove('hidden');

                const payload = {
                    action: 'deleteApplication',
                    appId: appId,
                    memberName: name,
                    selectedDate: currentDate
                };

                fetch(GAS_WEB_APP_URL, {
                    method: 'POST',
                    body: JSON.stringify(payload)
                })
                .then(res => res.json())
                .then(res => {
                    alert(res.message);
                    loadCalendar();
                })
                .catch(err => handleScriptError(err));
            }
        }
    </script>
</body>
</html>
